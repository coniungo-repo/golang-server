name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
      supertokens:
        image: registry.supertokens.io/supertokens/supertokens-postgresql:12.2.0
        env:
          POSTGRESQL_CONNECTION_URI: postgresql://ci:ci@postgres:5432/postgres
          API_KEYS: ci-supertokens-api-key-0123456789
        ports:
          - 3567:3567
    env:
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci?sslmode=disable
      TEST_SUPERTOKENS_URI: http://localhost:3567
      TEST_SUPERTOKENS_API_KEY: ci-supertokens-api-key-0123456789
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            tools.sum
      - run: go mod verify
      - run: make lint
      - run: go tool -modfile=tools.mod goose -dir migrations postgres "$TEST_DATABASE_URL" up
      - name: Wait for SuperTokens core
        run: for i in $(seq 1 60); do curl -sf http://localhost:3567/hello && exit 0; sleep 2; done; exit 1
      - run: make test
      - run: make vuln

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --build-arg VERSION=${{ github.sha }} -t golang-server:ci .
