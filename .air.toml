root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/api ./cmd/api"
  entrypoint = ["./tmp/api"]
  include_ext = ["go"]
  exclude_dir = ["tmp", "bin", "testdata", "migrations", "deploy", "api"]
  exclude_regex = ["_test\\.go$"]
  delay = 300
  send_interrupt = true
  kill_delay = "5s"
  stop_on_error = true

[log]
  main_only = true

[misc]
  clean_on_exit = true

[screen]
  clear_on_rebuild = false
