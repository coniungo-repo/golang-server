# Staging SuperTokens core on Fly.io, reachable only over Flycast at http://getgbam-supertokens-staging.flycast.
# Deploy with `make deploy-core-staging`. Before the first deploy run `fly ips allocate-v6 --private -a getgbam-supertokens-staging`,
# and check `fly ips list -a getgbam-supertokens-staging` shows no public address.
# POSTGRESQL_CONNECTION_URI and API_KEYS are secrets, set with `fly secrets set`.
# Keep the image version in step with deploy/docker-compose.yml.

app = "getgbam-supertokens-staging"
primary_region = "lhr"

[build]
  image = "registry.supertokens.io/supertokens/supertokens-postgresql:12.2.0"

[env]
  ACCESS_TOKEN_VALIDITY = "900"
  PASSWORDLESS_CODE_LIFETIME = "600000"
  PASSWORDLESS_MAX_CODE_INPUT_ATTEMPTS = "5"

[http_service]
  internal_port = 3567
  force_https = false
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/hello"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
